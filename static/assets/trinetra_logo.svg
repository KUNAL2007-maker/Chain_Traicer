  <!-- Forensic Pupil Circle -->
  <circle cx="50" cy="50" r="14" fill="url(#trinetraCyan)"/>
  <circle cx="50" cy="50" r="6" fill="#ffffff"/>
  <!-- Crosshairs / Reticle ticks -->
  <line x1="50" y1="18" x2="50" y2="24" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="76" x2="50" y2="82" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="18" y1="50" x2="24" y2="50" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="76" y1="50" x2="82" y2="50" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
</svg>
